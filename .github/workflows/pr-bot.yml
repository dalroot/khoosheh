name: Pull Request Automation & Security Bot

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  pr-security-audit:
    name: PR Security & Integrity Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Lint & Syntax Verification
        run: |
          python -m py_compile server.py
          bash -n scripts/install.sh
          bash -n scripts/update.sh
          bash -n scripts/backup.sh

      - name: Validate Example Configs
        run: |
          python -c "import json; json.load(open('config.example.json'))"

      - name: Scan Secrets & Safety
        run: |
          pip install bandit safety
          bandit -r core/ server.py -ll -ii || true

      - name: PR Security Summary
        run: |
          echo "✅ All PR automated security checks and syntax validations passed successfully."
